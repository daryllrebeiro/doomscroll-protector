<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inner container scroll fixture — mimics Reddit/Instagram</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: sans-serif;
      }
      #app {
        display: flex;
        height: 100%;
      }
      #sidebar {
        width: 200px;
        background: #eee;
        padding: 16px;
      }
      #main {
        flex: 1;
        overflow-y: scroll;
        padding: 16px;
        height: 100%;
        box-sizing: border-box;
      }
      .item {
        height: 400px;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #f9f9f9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <h2>Sidebar</h2>
        <p>This does not scroll.</p>
      </div>
      <main id="main">
        <h1>Inner Container Scroll Feed</h1>
        <div class="item">Item 1 — keep scrolling</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item">Item 6</div>
        <div class="item">Item 7</div>
        <div class="item">Item 8</div>
        <div class="item">Item 9</div>
        <div class="item">Item 10</div>
        <textarea placeholder="Write a comment" id="comment-box"></textarea>
      </main>
    </div>
  </body>
</html>
